<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Registro de desembolsos</title><style>
*{box-sizing:border-box}body{margin:0;padding:20px;background:#f6f7fa;color:#182b48;font:15px/1.5 system-ui,sans-serif}h1{font-size:25px;margin:0 0 4px}h2{font-size:18px;margin:0 0 18px}.muted{color:#64748b}.wrap{max-width:1050px;margin:0 auto}.card{background:white;border:1px solid #e1e5ed;border-radius:14px;padding:22px;margin-top:17px;box-shadow:0 1px 2px #00000008}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}label{display:block;font-weight:600;font-size:13px;margin:0 0 6px}input,select{font:inherit;width:100%;border:1px solid #cbd5e1;border-radius:9px;padding:12px;background:#fff;color:#1f2937;min-height:45px}button{font:inherit;cursor:pointer;border:1px solid #d2d8e2;border-radius:9px;padding:10px 17px;background:white}button.primary{border-color:#da282d;background:#da282d;color:white;font-weight:700}button:disabled{opacity:.55;cursor:wait}.toolbar{display:flex;gap:12px;align-items:end;flex-wrap:wrap}.toolbar>div{flex:1;min-width:180px}.status{padding:12px;margin-top:15px;border-radius:8px;background:#eff6ff}.status.error{background:#fef2f2;color:#991b1b}.table{overflow-x:auto}table{border-collapse:collapse;width:100%;text-align:left;margin-top:12px}td,th{padding:11px;border-bottom:1px solid #e5eaf2;font-size:13px}th{background:#f8fafc}button.tab[aria-selected=true]{border-color:#da282d;color:#da282d;font-weight:700}.tabs{display:flex;gap:8px;margin-top:18px}.pager{display:flex;justify-content:flex-end;align-items:center;gap:12px;margin-top:15px}.hint{font-size:12px;color:#64748b;margin:7px 0 0}@media(max-width:600px){body{padding:10px}.card{padding:16px}.grid{grid-template-columns:1fr}th,td{padding:8px}}
</style></head><body><main class="wrap"><h1>Televentas · Desembolsos</h1><p class="muted">Registra certificados y consulta tu historial por período.</p><nav class="tabs" aria-label="Secciones"><button type="button" class="tab" id="tab-create" aria-selected="true">Nuevo desembolso</button><button type="button" class="tab" id="tab-list" aria-selected="false">Mis desembolsos</button></nav>
<section class="card" id="create"><h2>Registrar desembolso</h2><form id="form"><div class="grid">
<div><label for="certificado">* Certificado (exactamente 9 números)</label><input id="certificado" name="certificado" type="text" inputmode="numeric" minlength="9" maxlength="9" pattern="[0-9]{9}" autocomplete="off" required></div>
<div><label for="tipo_venta">Tipo de venta</label><select id="tipo_venta" required><option value="">Seleccionar</option><option>EXTRA</option><option>INTRA</option><option>CORTA CUOTAS</option></select></div>
<div><label for="tipo_desembolso">Tipo de desembolso</label><select id="tipo_desembolso" required><option value="">Seleccionar</option><option>CUENTA</option><option>VENTANILLA</option></select></div>
<div><label for="fecha_desembolso">* Fecha de desembolso</label><input id="fecha_desembolso" type="date" required></div></div><p class="hint">El registro se asociará automáticamente con tu usuario del Hub.</p><p><button id="submit" class="primary" type="submit">Guardar desembolso</button></p></form></section>
<section class="card" id="listing" hidden><h2>Mis desembolsos</h2><div class="toolbar"><div><label for="periodo">Período</label><input type="month" id="periodo" required></div><button id="refresh" class="primary" type="button">Consultar</button></div><p class="muted" id="count">Selecciona un período.</p><div class="table"><table><thead><tr><th>Fecha de desembolso</th><th>Certificado</th><th>Tipo de venta</th><th>Tipo de desembolso</th></tr></thead><tbody id="records"></tbody></table></div><div class="pager"><button id="prev" type="button">Anterior</button><span id="page"></span><button id="next" type="button">Siguiente</button></div></section><p id="message" role="status" class="status" hidden></p></main>
<script>
const el=id=>document.getElementById(id),pending=new Map();let serial=0,page=0,more=false,working=false;
function request(operation,input){return new Promise((resolve,reject)=>{const id=++serial;const timeout=setTimeout(()=>{pending.delete(id);reject(Error('La solicitud excedió el tiempo disponible.'));},18000);pending.set(id,{resolve,reject,timeout});parent.postMessage({type:'hub:request',id,operation,input},'*');});}
window.addEventListener('message',e=>{if(e.source!==parent||e.data?.type!=='hub:response')return;const item=pending.get(e.data.id);if(!item)return;clearTimeout(item.timeout);pending.delete(e.data.id);e.data.error?item.reject(Error(e.data.error)):item.resolve(e.data.result);});
function status(t,error=false){el('message').textContent=t;el('message').classList.toggle('error',error);el('message').hidden=false;}
function show(which){el('create').hidden=which!=='create';el('listing').hidden=which!=='list';el('tab-create').setAttribute('aria-selected',String(which==='create'));el('tab-list').setAttribute('aria-selected',String(which==='list'));if(which==='list')load();}
function today(){const d=new Date();const parts=new Intl.DateTimeFormat('en-CA',{timeZone:'America/Tegucigalpa',year:'numeric',month:'2-digit',day:'2-digit'}).formatToParts(d);const v=k=>parts.find(p=>p.type===k).value;return v('year')+'-'+v('month')+'-'+v('day');}
async function load(){if(working)return;working=true;el('refresh').disabled=true;try{const result=await request('history',{period:el('periodo').value,page});const table=el('records');table.replaceChildren();for(const r of result.rows){const tr=document.createElement('tr');for(const key of ['fecha_desembolso','certificado','tipo_venta','tipo_desembolso']){const td=document.createElement('td');td.textContent=r[key]??'—';tr.append(td);}table.append(tr);}more=!!result.hasMore;el('count').textContent=result.rows.length+' registro(s) en la página';el('page').textContent='Página '+(page+1);el('prev').disabled=page===0;el('next').disabled=!more;if(!result.rows.length)status('No hay desembolsos en el período seleccionado.');else el('message').hidden=true;}catch(e){status('No fue posible consultar el historial: '+e.message,true);}finally{working=false;el('refresh').disabled=false;}}
el('periodo').value=today().slice(0,7);el('fecha_desembolso').value=today();
el('tab-create').onclick=()=>show('create');el('tab-list').onclick=()=>{page=0;show('list');};el('refresh').onclick=()=>{page=0;load();};el('periodo').onchange=()=>{page=0;load();};el('prev').onclick=()=>{if(page>0){page--;load();}};el('next').onclick=()=>{if(more){page++;load();}};
el('form').onsubmit=async e=>{e.preventDefault();if(working)return;const certificado=el('certificado').value.trim();if(!/^[0-9]{9}$/.test(certificado)){status('El certificado debe contener exactamente 9 números.',true);return;}working=true;el('submit').disabled=true;try{await request('save',{certificado,tipo_venta:el('tipo_venta').value,tipo_desembolso:el('tipo_desembolso').value,fecha_desembolso:el('fecha_desembolso').value});el('form').reset();el('fecha_desembolso').value=today();status('Desembolso registrado correctamente.');}catch(e){status('No se pudo guardar el desembolso: '+e.message,true);}finally{working=false;el('submit').disabled=false;}};
</script></body></html>
